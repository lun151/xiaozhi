server:
  port: 8080
# 设置语言模型的API密钥和模型名称
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASH_SCOPE_API_KEY}
      model-name: deepseek-v3
      # 开启请求日志和响应日志
      log-requests: true
      log-responses: true
#阿里百炼平台， url已经封装，不需要另外配置
  community:
    dashscope:
      streaming-chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-plus
      chat-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: qwen-max
      embedding-model:
        api-key: ${DASH_SCOPE_API_KEY}
        model-name: text-embedding-v3
  #启用日志debug级别
logging:
  level:
    root: info

spring.data.mongodb.url: mongodb://localhost:27017/chat_memory_db

# 基本数据源配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 开启 SQL 日志打印
mybatis-plus.configuration.log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
